name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ubuntu-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25.x', 'stable']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - name: Test
        run: CGO_ENABLED=0 go test ./...
      - name: Vet
        run: CGO_ENABLED=0 go vet ./...
      - name: Race detector
        if: matrix.go-version == 'stable'
        run: go test -race ./...
      - name: Build Ubuntu server binaries
        if: matrix.go-version == 'stable'
        shell: bash
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -o /tmp/bastionctl-server-ubuntu-amd64 ./cmd/bastionctl
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -buildvcs=false -o /tmp/bastionctl-server-ubuntu-arm64 ./cmd/bastionctl

  windows-desktop:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.25.x'
          cache: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/windows/package-lock.json
      - name: Build frontend
        working-directory: ui/windows
        run: |
          npm ci
          npm run build
      - name: Test Windows packages
        run: go test ./...
      - name: Build native desktop application
        run: go build -trimpath -buildvcs=false -ldflags "-s -w -H=windowsgui -X main.version=2.0.0-ci" -o bastionctl-admin-windows-amd64.exe ./cmd/bastionctl-desktop
