name: CI

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    bash:
        name: Bash and smoke tests
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - name: Install test tools
              run: |
                  sudo apt-get update
                  sudo apt-get install -y shellcheck ripgrep openssh-client iproute2
            - name: ShellCheck
              run: shellcheck -S warning secure-linux-wizard.sh secure-linux-wizard-ru.sh secure-linux-wizard-en.sh tests/smoke.sh
            - name: Smoke tests
              run: bash tests/smoke.sh

    powershell:
        name: Windows PowerShell parser
        runs-on: windows-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - name: Parse helper with Windows PowerShell 5.1
              shell: powershell
              run: |
                  $tokens = $null
                  $errors = $null
                  [System.Management.Automation.Language.Parser]::ParseFile(
                    (Resolve-Path .\secure-linux-admin.ps1),
                    [ref]$tokens,
                    [ref]$errors
                  ) | Out-Null
                  if ($errors.Count -gt 0) {
                    $errors | Format-List -Force
                    exit 1
                  }
            - name: Parse helper with PowerShell 7
              shell: pwsh
              run: |
                  $tokens = $null
                  $errors = $null
                  [System.Management.Automation.Language.Parser]::ParseFile(
                    (Resolve-Path .\secure-linux-admin.ps1),
                    [ref]$tokens,
                    [ref]$errors
                  ) | Out-Null
                  if ($errors.Count -gt 0) {
                    $errors | Format-List -Force
                    exit 1
                  }
